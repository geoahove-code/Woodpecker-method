<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ensembles — Woodpecker Method</title>
  <meta name="theme-color" content="#0d0f14">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="sets">
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3c1.6 1.1 2.4 2.7 2.4 4.6 0 2.4-1.6 4.1-3.6 4.9l-4.9 4.9"/>
          <path d="M8.4 20.4 6 18l5-5"/>
          <path d="M16.8 8.4 20 5.2"/><circle cx="17.6" cy="4.4" r="1"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong data-i18n="app.name"></strong>
        <small data-i18n="app.tagline"></small>
      </span>
    </a>
    <nav class="nav" aria-label="Navigation">
      <a href="index.html" data-i18n="nav.dashboard"></a>
      <a href="train.html" data-i18n="nav.train"></a>
      <a href="sets.html" data-i18n="nav.sets"></a>
      <a href="stats.html" data-i18n="nav.stats"></a>
    </nav>
    <div class="topbar-actions">
      <button class="icon-btn" id="sound-toggle" title="Son" aria-label="Son">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" class="sound-wave"/><path d="M18.5 6a9 9 0 0 1 0 12" class="sound-wave2"/>
        </svg>
      </button>
      <button class="ghost-btn" id="lang-toggle">FR / EN</button>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 data-i18n="sets.title"></h1>
        <p class="muted" data-i18n="sets.subtitle"></p>
      </div>
      <div class="page-head-actions">
        <button class="btn btn-ghost" id="btn-import" data-i18n="sets.import"></button>
        <button class="btn btn-primary" id="btn-new-set" data-i18n="sets.new"></button>
      </div>
    </div>

    <section class="grid-2 align-start">
      <article class="card" id="create-card" hidden>
        <header class="card-head">
          <h2 data-i18n="sets.new"></h2>
          <button class="icon-btn" id="btn-close-create" aria-label="Fermer">✕</button>
        </header>
        <form id="create-form" class="form">
          <label class="field">
            <span data-i18n="sets.name"></span>
            <input type="text" id="set-name-input" data-i18n-placeholder="sets.namePlaceholder" maxlength="60" required>
          </label>

          <div class="field">
            <span data-i18n="sets.themes"></span>
            <div class="chip-grid" id="theme-chips"></div>
          </div>

          <div class="field">
            <span data-i18n="sets.levels"></span>
            <div class="chip-grid" id="level-chips"></div>
          </div>

          <label class="field">
            <span data-i18n="sets.count"></span>
            <input type="number" id="count-input" value="40" min="4" max="300" step="1">
          </label>

          <p class="hint" id="available-hint"></p>

          <button type="submit" class="btn btn-primary" data-i18n="sets.create"></button>
        </form>
      </article>

      <article class="card" id="sets-card">
        <header class="card-head">
          <h2 data-i18n="dash.sets"></h2>
          <span class="muted" id="sets-count"></span>
        </header>
        <div class="set-list" id="sets-list"></div>
      </article>
    </section>

    <div class="modal" id="import-modal" hidden>
      <div class="modal-box modal-wide">
        <h2 data-i18n="sets.importTitle"></h2>
        <p class="modal-text" data-i18n="sets.importHint"></p>
        <form id="import-form" class="form">
          <label class="field">
            <span data-i18n="sets.importName"></span>
            <input type="text" id="import-name" maxlength="60" required>
          </label>
          <label class="field">
            <span data-i18n="sets.importTarget"></span>
            <select id="import-target"></select>
          </label>
          <label class="field">
            <span data-i18n="sets.importType"></span>
            <select id="import-format">
              <option value="pgn">PGN</option>
              <option value="fen">FEN + UCI</option>
            </select>
          </label>
          <label class="field row" id="setup-first-row">
            <input type="checkbox" id="import-setup-first" style="width:auto">
            <span data-i18n="sets.pgnSetup"></span>
          </label>
          <label class="field">
            <span data-i18n="sets.importSource"></span>
            <textarea id="import-source" rows="6" spellcheck="false" required></textarea>
          </label>
          <p class="hint" id="import-hint"></p>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="btn-close-import" data-i18n="common.cancel"></button>
            <button type="submit" class="btn btn-primary" data-i18n="sets.importAdd"></button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast-host" id="toast-host" aria-live="polite"></div>
  </main>
  <script type="module" src="js/sets.js"></script>
</body>
</html>
