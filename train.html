<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entraînement — Woodpecker Method</title>
  <meta name="theme-color" content="#0d0f14">
  <link rel="stylesheet" href="lib/chessground.base.css">
  <link rel="stylesheet" href="lib/chessground.brown.css">
  <link rel="stylesheet" href="lib/chessground.cburnett.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/board.css">
</head>
<body data-page="train">
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3c1.6 1.1 2.4 2.7 2.4 4.6 0 2.4-1.6 4.1-3.6 4.9l-4.9 4.9"/>
          <path d="M8.4 20.4 6 18l5-5"/>
          <path d="M16.8 8.4 20 5.2"/><circle cx="17.6" cy="4.4" r="1"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong data-i18n="app.name"></strong>
        <small data-i18n="app.tagline"></small>
      </span>
    </a>
    <nav class="nav" aria-label="Navigation">
      <a href="index.html" data-i18n="nav.dashboard"></a>
      <a href="train.html" data-i18n="nav.train"></a>
      <a href="sets.html" data-i18n="nav.sets"></a>
      <a href="stats.html" data-i18n="nav.stats"></a>
    </nav>
    <div class="topbar-actions">
      <button class="icon-btn" id="sound-toggle" title="Son" aria-label="Son">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" class="sound-wave"/><path d="M18.5 6a9 9 0 0 1 0 12" class="sound-wave2"/>
        </svg>
      </button>
      <button class="ghost-btn" id="lang-toggle">FR / EN</button>
    </div>
  </header>

  <main class="page train-page" id="train-root">
    <section class="train-main">
      <div class="train-head">
        <div class="train-head-left">
          <span class="kicker" id="set-name">—</span>
          <h1 id="puzzle-counter">—</h1>
        </div>
        <div class="train-head-right">
          <div class="timer-box" id="cycle-timer">
            <span data-i18n="train.timerCycle"></span>
            <strong id="cycle-clock">00:00</strong>
          </div>
          <div class="timer-box" id="puzzle-timer">
            <span data-i18n="train.timerPuzzle"></span>
            <strong id="puzzle-clock">0:00</strong>
          </div>
        </div>
      </div>

      <div class="board-frame">
        <div id="board" class="board"></div>
        <div class="promo-overlay" id="promo" hidden>
          <div class="promo-box">
            <p class="promo-title" data-i18n="train.promoTitle"></p>
            <div class="promo-choices" id="promo-choices"></div>
          </div>
        </div>
        <div class="board-banner" id="board-banner" hidden></div>
      </div>

      <div class="board-controls">
        <button class="btn btn-ghost" id="btn-retry" data-i18n="train.retry"></button>
        <button class="btn btn-ghost" id="btn-flip" data-i18n="train.flip"></button>
        <button class="btn btn-ghost" id="btn-solution" data-i18n="train.solution"></button>
        <button class="btn btn-primary" id="btn-next" data-i18n="train.next" hidden></button>
      </div>
    </section>

    <aside class="train-panel">
      <div class="puzzle-meta">
        <span class="badge badge-theme" id="theme-badge">—</span>
        <span class="badge" id="level-badge">—</span>
        <span class="badge" id="rating-badge">—</span>
      </div>

      <p class="status-line" id="status-line" data-i18n="train.findBest"></p>

      <div class="progress-block">
        <div class="progress-head">
          <span id="variants-label">0 / 0</span>
          <span id="errors-count" class="errors-count"></span>
        </div>
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
      </div>

      <article class="card tree-card">
        <header class="card-head">
          <h2 data-i18n="train.tree"></h2>
          <button class="icon-btn tree-toggle" id="tree-toggle" aria-expanded="true" aria-controls="tree-body">▾</button>
        </header>
        <div id="tree-body">
          <div class="tree-panel" id="tree-panel"></div>
          <p class="hint muted" data-i18n="train.treeHint"></p>
        </div>
      </article>

      <div class="panel-actions">
        <button class="btn btn-ghost btn-sm" id="btn-finish" data-i18n="train.finishCycle"></button>
        <button class="btn btn-ghost btn-sm" id="btn-quit" data-i18n="train.quit"></button>
      </div>
    </aside>
  </main>

  <div class="modal" id="cycle-modal" hidden>
    <div class="modal-box">
      <h2 data-i18n="train.cycleDone"></h2>
      <p id="cycle-summary" class="modal-text"></p>
      <div class="modal-actions">
        <a class="btn btn-ghost" href="index.html" data-i18n="train.backToDash"></a>
        <a class="btn btn-primary" href="train.html" id="new-cycle" data-i18n="train.newCycle"></a>
      </div>
    </div>
  </div>

  <div class="modal" id="empty-modal" hidden>
    <div class="modal-box">
      <h2 data-i18n="train.noSet"></h2>
      <p class="modal-text" data-i18n="train.noSetHint"></p>
      <div class="modal-actions">
        <a class="btn btn-primary" href="sets.html" data-i18n="dash.createSet"></a>
      </div>
    </div>
  </div>

  <div class="toast-host" id="toast-host" aria-live="polite"></div>
  <script type="module" src="js/train.js"></script>
</body>
</html>
