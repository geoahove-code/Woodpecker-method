<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Woodpecker Method — Entraînement tactique multi-variantes</title>
  <meta name="description" content="Entraînement tactique aux échecs selon la méthode Woodpecker, avec résolution multi-variantes de l'arbre de solution.">
  <meta name="theme-color" content="#0d0f14">
  <link rel="stylesheet" href="lib/chessground.base.css">
  <link rel="stylesheet" href="lib/chessground.brown.css">
  <link rel="stylesheet" href="lib/chessground.cburnett.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/board.css">
</head>
<body data-page="dashboard">
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3c1.6 1.1 2.4 2.7 2.4 4.6 0 2.4-1.6 4.1-3.6 4.9l-4.9 4.9"/>
          <path d="M8.4 20.4 6 18l5-5"/>
          <path d="M16.8 8.4 20 5.2"/><circle cx="17.6" cy="4.4" r="1"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong data-i18n="app.name"></strong>
        <small data-i18n="app.tagline"></small>
      </span>
    </a>
    <nav class="nav" aria-label="Navigation">
      <a href="index.html" data-i18n="nav.dashboard"></a>
      <a href="train.html" data-i18n="nav.train"></a>
      <a href="sets.html" data-i18n="nav.sets"></a>
      <a href="stats.html" data-i18n="nav.stats"></a>
    </nav>
    <div class="topbar-actions">
      <button class="icon-btn" id="sound-toggle" title="Son" aria-label="Son">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" class="sound-wave"/><path d="M18.5 6a9 9 0 0 1 0 12" class="sound-wave2"/>
        </svg>
      </button>
      <button class="ghost-btn" id="lang-toggle">FR / EN</button>
    </div>
  </header>

  <main class="page">
    <section class="hero card">
      <div class="hero-copy">
        <span class="kicker" data-i18n="dash.heroKicker"></span>
        <h1 data-i18n="dash.heroTitle"></h1>
        <p data-i18n="dash.heroText"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" id="hero-primary" href="sets.html" data-i18n="dash.startCycle"></a>
          <a class="btn btn-ghost" href="sets.html" data-i18n="dash.createSet"></a>
        </div>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <div class="hero-branches">
          <span class="branch branch-main"></span>
          <span class="branch branch-a"></span>
          <span class="branch branch-b"></span>
          <span class="node node-root"></span>
          <span class="node node-a"></span>
          <span class="node node-b"></span>
          <span class="node node-leaf"></span>
        </div>
      </div>
    </section>

    <section class="kpis" id="dash-kpis" aria-live="polite"></section>

    <section class="grid-2">
      <article class="card">
        <header class="card-head">
          <h2 data-i18n="dash.progression"></h2>
          <span class="muted" id="progression-set"></span>
        </header>
        <div id="progression-chart" class="chart-host"></div>
      </article>
      <article class="card">
        <header class="card-head">
          <h2 data-i18n="dash.sets"></h2>
          <a class="link" href="sets.html" data-i18n="dash.createSet"></a>
        </header>
        <div id="dash-sets" class="set-list"></div>
      </article>
    </section>

    <section class="card">
      <header class="card-head">
        <h2 data-i18n="dash.themes"></h2>
        <span class="muted" data-i18n="dash.themesHint"></span>
      </header>
      <div class="theme-grid" id="theme-grid"></div>
    </section>
  </main>

  <div class="toast-host" id="toast-host" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
