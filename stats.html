<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statistiques — Woodpecker Method</title>
  <meta name="theme-color" content="#0d0f14">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="stats">
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3c1.6 1.1 2.4 2.7 2.4 4.6 0 2.4-1.6 4.1-3.6 4.9l-4.9 4.9"/>
          <path d="M8.4 20.4 6 18l5-5"/>
          <path d="M16.8 8.4 20 5.2"/><circle cx="17.6" cy="4.4" r="1"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong data-i18n="app.name"></strong>
        <small data-i18n="app.tagline"></small>
      </span>
    </a>
    <nav class="nav" aria-label="Navigation">
      <a href="index.html" data-i18n="nav.dashboard"></a>
      <a href="train.html" data-i18n="nav.train"></a>
      <a href="sets.html" data-i18n="nav.sets"></a>
      <a href="stats.html" data-i18n="nav.stats"></a>
    </nav>
    <div class="topbar-actions">
      <button class="icon-btn" id="sound-toggle" title="Son" aria-label="Son">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" class="sound-wave"/><path d="M18.5 6a9 9 0 0 1 0 12" class="sound-wave2"/>
        </svg>
      </button>
      <button class="ghost-btn" id="lang-toggle">FR / EN</button>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 data-i18n="stats.title"></h1>
        <p class="muted" data-i18n="stats.subtitle"></p>
      </div>
    </div>

    <section class="kpis" id="stats-kpis"></section>

    <section class="grid-2">
      <article class="card">
        <header class="card-head"><h2 data-i18n="stats.curve"></h2></header>
        <div id="curve-chart" class="chart-host"></div>
      </article>
      <article class="card">
        <header class="card-head"><h2 data-i18n="stats.byTheme"></h2></header>
        <div id="theme-bars"></div>
      </article>
    </section>

    <section class="card">
      <header class="card-head">
        <h2 data-i18n="stats.heatmap"></h2>
        <span class="muted" data-i18n="stats.heatmapHint"></span>
      </header>
      <div id="heatmap" class="heatmap"></div>
      <div class="heatmap-legend">
        <span class="muted" data-i18n="stats.legendLow"></span>
        <span class="legend-scale"></span>
        <span class="muted" data-i18n="stats.legendHigh"></span>
      </div>
    </section>

    <section class="card">
      <header class="card-head"><h2 data-i18n="stats.history"></h2></header>
      <div class="table-wrap">
        <table class="table" id="history-table">
          <thead>
            <tr>
              <th data-i18n="sets.name"></th>
              <th data-i18n="stats.cycle"></th>
              <th data-i18n="stats.date"></th>
              <th data-i18n="stats.time"></th>
              <th data-i18n="stats.solved"></th>
              <th data-i18n="stats.failed"></th>
              <th data-i18n="stats.accuracy"></th>
              <th data-i18n="stats.compression"></th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </section>

    <div class="toast-host" id="toast-host" aria-live="polite"></div>
  </main>
  <script type="module" src="js/stats.js"></script>
</body>
</html>
